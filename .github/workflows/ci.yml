name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend-check:
    name: Backend Checks
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: masterygrid_ci
          POSTGRES_USER: masterygrid_ci
          POSTGRES_PASSWORD: masterygrid_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_ENV: dev
      SECRET_KEY: django-insecure-ci-only-not-for-production
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      DATABASE_NAME: masterygrid_ci
      DATABASE_USER: masterygrid_ci
      DATABASE_PASSWORD: masterygrid_ci
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: "5432"
      AI_GENERATION_ENABLED: "False"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/dev.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/dev.txt

      - name: Run Django checks
        working-directory: backend
        run: python manage.py check

      - name: Check migrations
        working-directory: backend
        run: python manage.py makemigrations --check --dry-run

  frontend-check:
    name: Frontend Checks
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000/api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Type-check frontend
        working-directory: frontend
        run: npm run type-check

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build
